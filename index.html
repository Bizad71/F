<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست اسکنر</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        button {
            display: block;
            width: 100%;
            max-width: 350px;
            margin: 20px auto;
            padding: 18px;
            border: 0;
            border-radius: 14px;
            background: #2563eb;
            color: white;
            font-size: 20px;
        }

        input {
            display: block;
            width: 100%;
            max-width: 350px;
            margin: 20px auto;
            padding: 16px;
            border-radius: 12px;
            border: 0;
            font-size: 20px;
            text-align: center;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <h2>تست بارکدخوان خارجی</h2>

    <button onclick="openScanner()">
        📷 اسکن بارکد
    </button>

    <input
        id="barcode"
        type="text"
        placeholder="نتیجه اسکن اینجا می‌آید"
        readonly
    >

    <script>

        function openScanner() {

            const returnUrl =
                window.location.origin +
                window.location.pathname +
                "?result={RESULT}";

            const scannerUrl =
                "binaryeye://scan?ret=" +
                encodeURIComponent(returnUrl);

            window.location.href = scannerUrl;
        }


        const params =
            new URLSearchParams(window.location.search);

        const result =
            params.get("result");

        if (result) {

            document.getElementById("barcode").value =
                result;

        }

    </script>

</body>
</html>
