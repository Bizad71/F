<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<meta name="theme-color" content="#020609">

<title>Format Information</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <div class="header">
        <div class="main-title">
            فرمت اطلاعات
        </div>

        <div id="phase">
            INITIALIZING...
        </div>
    </div>


    <div class="percent">
        <span id="percent">0</span>%
    </div>


    <div class="main-progress">
        <div id="mainBar"></div>
    </div>


    <div id="message" class="message">
        آماده‌سازی فرایند...
    </div>


    <!-- دکمه اسکن چهره -->

    <div id="faceSection"
         class="face-section">

        <div class="face-warning">
            برای لغو فرمت اطلاعات،
            اسکن چهره لازم است
        </div>

        <button id="faceButton">
            لغو فرمت اطلاعات با اسکن چهره
        </button>

    </div>


    <!-- دوربین -->

    <div id="cameraBox"
         class="camera-box">

        <video id="camera"
               autoplay
               playsinline>
        </video>

        <canvas id="canvas"></canvas>

        <div class="camera-text">
            در حال اسکن چهره...
        </div>

    </div>


    <!-- نتیجه نهایی -->

    <div id="result"
         class="result">

        <div class="result-title">
            اسکن چهره موفق نبود
        </div>

        <img id="photo"
             alt="Face Scan">

        <div class="joke">
            <div>تلسیدی...</div>

            <strong>
                نتلس مقشی بود
            </strong>
        </div>

    </div>


    <!-- اطلاعات پایین -->

    <div class="media">

        <div class="media-title">
            DATA PROCESSING
        </div>

        <div class="item">
            <div>
                PHOTOS
                <span id="p1">0%</span>
            </div>

            <div class="small-bar">
                <i id="b1"></i>
            </div>

            <small id="s1">
                Waiting...
            </small>
        </div>


        <div class="item">
            <div>
                VIDEOS
                <span id="p2">0%</span>
            </div>

            <div class="small-bar">
                <i id="b2"></i>
            </div>

            <small id="s2">
                Waiting...
            </small>
        </div>


        <div class="item">
            <div>
                DOCUMENTS
                <span id="p3">0%</span>
            </div>

            <div class="small-bar">
                <i id="b3"></i>
            </div>

            <small id="s3">
                Waiting...
            </small>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
