<!DOCTYPE html><html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>تست Gamma Scanner</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Tahoma, Arial, sans-serif;
        background: #f3f4f6;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .box {
        width: 100%;
        max-width: 420px;
        background: white;
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        text-align: center;
    }

    h1 {
        margin: 0 0 10px;
        color: #111827;
        font-size: 24px;
    }

    p {
        color: #6b7280;
        line-height: 1.8;
        margin-bottom: 25px;
    }

    button {
        width: 100%;
        border: none;
        border-radius: 14px;
        padding: 16px;
        background: #2563eb;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    button:active {
        transform: scale(0.98);
    }

    .result {
        margin-top: 20px;
        padding: 14px;
        background: #f3f4f6;
        border-radius: 12px;
        color: #374151;
        font-size: 14px;
        word-break: break-word;
    }
</style>

</head><body><div class="box"><h1>Bizadshop</h1>

<p>
    تست باز کردن برنامه<br>
    Gamma QR & Barcode Scanner
</p>

<button onclick="openGammaScanner()">
    📷 باز کردن Gamma Scanner
</button>

<div class="result" id="status">
    آماده تست
</div>

</div><script>

function openGammaScanner() {

    document.getElementById("status").textContent =
        "در حال باز کردن Gamma...";

    /*
        تلاش اول:
        باز کردن مستقیم اپلیکیشن با Android Intent
    */

    const intentUrl =
        "intent:#Intent;" +
        "action=android.intent.action.MAIN;" +
        "category=android.intent.category.LAUNCHER;" +
        "package=com.gamma.scan;" +
        "end";

    window.location.href = intentUrl;

    /*
        اگر مرورگر Intent را اجرا نکرد،
        بعد از چند ثانیه وضعیت را نمایش می‌دهیم.
    */

    setTimeout(function () {

        document.getElementById("status").textContent =
            "اگر Gamma باز نشد، مرورگر اجازه اجرای برنامه را نداده است.";

    }, 2500);
}

</script></body>
</html>
