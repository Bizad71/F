<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تست بارکد Bizadshop</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        .card {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        p {
            text-align: center;
            color: #6b7280;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 52px;
            padding: 10px 14px;
            border: 2px solid #d1d5db;
            border-radius: 12px;
            font-size: 18px;
            direction: ltr;
            text-align: left;
        }

        button {
            width: 100%;
            height: 52px;
            margin-top: 20px;
            border: 0;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        button:active {
            transform: scale(.98);
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #f9fafb;
            border-radius: 12px;
            word-break: break-all;
            text-align: center;
        }

    </style>

</head>


<body>


<div class="card">

    <h1>
        تست بارکد
    </h1>

    <p>
        تست ارتباط سایت با Scan to Web
    </p>


    <label for="barcode">
        بارکد
    </label>

    <input
        id="barcode"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="نتیجه اسکن اینجا قرار می‌گیرد"
    >


    <button
        id="scanBtn"
        type="button"
    >
        📷 اسکن بارکد
    </button>


    <div class="result">

        نتیجه فعلی:

        <strong id="result">
            هنوز اسکن نشده
        </strong>

    </div>

</div>


<script>

/* ============================================================
   TEST SCAN TO WEB
   ============================================================ */


/*
    فیلد بارکد
*/

const barcodeInput =
    document.getElementById(
        "barcode"
    );


/*
    نمایش نتیجه
*/

const result =
    document.getElementById(
        "result"
    );


/*
    دکمه اسکن
*/

const scanBtn =
    document.getElementById(
        "scanBtn"
    );


/* ============================================================
   باز کردن Scan to Web
   ============================================================ */

scanBtn.addEventListener(
    "click",
    function () {

        /*
            قبل از باز کردن برنامه،
            فیلد را فعال می‌کنیم.
        */

        barcodeInput.focus();


        /*
            Scheme مربوط به Scan to Web

            برنامه باید این لینک را دریافت کند.
        */

        const scannerURL =
            "bwstw://startscanner";


        console.log(
            "Opening:",
            scannerURL
        );


        /*
            باز کردن برنامه خارجی
        */

        window.location.href =
            scannerURL;

    }
);


/* ============================================================
   بررسی مقدار فیلد
   ============================================================ */

function checkBarcode() {

    const value =
        barcodeInput.value.trim();


    if (!value) {

        return;

    }


    result.textContent =
        value;


    console.log(
        "Barcode:",
        value
    );

}


/* ============================================================
   وقتی مقدار input تغییر کرد
   ============================================================ */

barcodeInput.addEventListener(
    "input",
    checkBarcode
);


/* ============================================================
   وقتی صفحه دوباره فعال شد
   ============================================================ */

document.addEventListener(
    "visibilitychange",
    function () {

        if (
            document.visibilityState ===
            "visible"
        ) {

            setTimeout(
                checkBarcode,
                300
            );

        }

    }
);


/* ============================================================
   وقتی مرورگر دوباره Focus گرفت
   ============================================================ */

window.addEventListener(
    "focus",
    function () {

        setTimeout(
            checkBarcode,
            300
        );

    }
);

</script>


</body>

</html>
